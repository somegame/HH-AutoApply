name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --timeout 20 --retries 2 -r requirements-dev.txt
      - run: python scripts/check_tracked_files.py
      - run: python -m compileall -q bot.py app tests scripts
      - run: python -c "import bot, app.database, app.scheduler, app.services"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Build container with Chromium
        if: github.event_name == 'pull_request'
        run: docker build -t hh-autoapply:ci .
      - name: Start Chromium in the container
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --network none -i hh-autoapply:ci python - <<'PY'
          import asyncio
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from types import SimpleNamespace

          from app.local_browser import LocalBrowser
          from app.login_view import LoginView

          async def smoke():
              with TemporaryDirectory() as data:
                  config = SimpleNamespace(
                      data_dir=Path(data),
                      chromium_path="/usr/bin/chromium-headless-shell",
                      login_public_url="https://bot.example.test",
                      web_port=0,
                  )
                  view = LoginView(config)
                  await view.start()
                  try:
                      async with LocalBrowser(config).session(interactive=True) as (_, page):
                          await page.set_content("<h1>Chromium smoke test</h1>")
                          assert await page.get_by_role("heading").inner_text() == "Chromium smoke test"
                          assert (await page.screenshot(type="jpeg")).startswith(b"\xff\xd8")
                          await view.issue(page)
                          await asyncio.wait_for(view.frame_ready.wait(), 5)
                          assert view.image.startswith(b"\xff\xd8")
                          await view.revoke()
                  finally:
                      await view.shutdown()

          asyncio.run(smoke())
          PY
