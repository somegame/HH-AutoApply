name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --timeout 20 --retries 2 -r requirements-dev.txt
      - run: python scripts/check_tracked_files.py
      - run: python -m compileall -q bot.py app tests scripts
      - run: python -c "import bot, app.database, app.scheduler, app.services"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
